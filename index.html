<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/main.css">
    <title>MaxProff</title>
</head>
<header class="header__info container">
        <button class="header__burger is-open" aria-label="Открыть меню">
            <img src="./icons/header_burger.svg" alt="">
        </button>
        <div class="header__logo">
            <img src="./icons/MaxProff.svg" alt="MaxProff">
        </div>
        <nav class="header__nav">
            <ul class="header__menu">
                <li class="header__item">
                    <a class="header__link header__link-active">Цены</a>
                </li>
                <li class="header__item">
                    <a class="header__link">Услуги</a>
                </li>
                <li class="header__item">
                    <a class="header__link">Портфолио</a>
                </li>
                <li class="header__item">
                    <a class="header__link">Акции</a>
                </li>
                <li class="header__item">
                    <a class="header__link">Преимущества</a>
                </li>
                <li class="header__item">
                    <a class="header__link">Блог</a>
                </li>
                <li class="header__item">
                    <a class="header__link">Контакты</a>
                </li>
            </ul>            
        </nav>
        <div class="header__call">
                <a class="header__phone" href="tel:+72332222222">
                    <img src="./icons/phone_icon.svg" alt="phone">
                    +7 (233) 222-22-22</a>
                <span class="header__time">08:00 - 22:00, без выходных</span>
            </div>
            <div class="header__socials-group">
            <a href="viber.com" class="header__socials"><img src="./icons/viber.svg" alt="viber"></a>
            <a href="whatsapp.com" class="header__socials"><img src="./icons/whatsapp.svg" alt="whatsapp"></a>
            <a href="telegrsm.com" class="header__socials"><img src="./icons/telegram.svg" alt="telegram"></a>
            </div>
        <button class="button__call button--outline">
            <span class="button__text">Заказать звонок</span>
            <img class="button__icon" src="./icons/phone_icon.svg" alt="">
        </button>
    </header>
<body>
    <div class="modal active" id="modal">
        <div class="modal__content">
            <button class="btn__modal__close">
                <img src="./icons/btn_close_modal.svg" alt="close"></button>
            <button class="modal__btn--call">Заказать звонок</button>
            <button class="modal__btn--calc button--outline">Калькулятор ремонта</button>

            <ul class="modal__list">
                <li class="modal__list_item"><a href="">Ремонт квартир</a></li>
                <li class="modal__list_item"><a href="">Дизайн интерьера</a></li>
                <li class="modal__list_item"><a href="">Ремонт комнат</a></li>
                <li class="modal__list_item"><a href="">Дома и котетджи</a></li>
                <li class="modal__list_item"><a href="">Другие услуги</a></li>
            </ul>

        </div>
        <div class="modal__overlay"></div>      
        
    </div>
    <script type="module" src="./scripts/main.js"></script>
</body>
</html>
